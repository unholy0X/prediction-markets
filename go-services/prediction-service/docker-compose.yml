services:
  postgres:
    image: postgres:15
    container_name: prediction-postgres
    environment:
      POSTGRES_USER: prediction
      POSTGRES_PASSWORD: prediction
      POSTGRES_DB: predictions
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - prediction-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prediction -d predictions"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  prediction-pgdata:
